<title>Spec ADE — The Agent-Native IDE</title>
<link rel="icon" type="image/png" href="assets/favicon-128x128.png">

<!-- Theme detection: blocking script to prevent flash (must be before CSS link) -->
<script>
(function(){
  var t=localStorage.getItem('spec-ade-theme');
  if(!t){t=window.matchMedia&&window.matchMedia('(prefers-color-scheme:light)').matches?'light':'dark';}
  if(t==='light')document.documentElement.setAttribute('data-theme','light');
})();
</script>
<link rel="stylesheet" href="style.css">
<style>
/* Mockup-only styles kept inline (not part of landing page theme) */
.ade{--app-bg:#080808;--app-surface:#17191b;--app-raised:#313234;--app-border:#252729;--app-text:#E2E4E8;--app-text-2:#8A8D92;--app-accent:#6E6ADE;--app-accent-h:#7B78E5;--app-pos:#50977c;--app-neg:#C4707D;--app-info:#38BDF8;--app-warn:#F0B429;--git-mod:#5E9FEF;--git-add:#68B06E;--git-del:#8A8E96;--git-unt:#D98080}
.ade{display:grid;grid-template-columns:280px 1fr;grid-template-rows:40px 1fr;gap:8px;padding:8px;width:100%;height:100%;font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:12px;color:var(--app-text);background:var(--app-bg);user-select:none}
.ade *{box-sizing:border-box}
.ade-sidebar-card{grid-row:1/3;border-radius:12px;border:1px solid var(--app-border);background:var(--app-surface);display:flex;flex-direction:column;overflow:hidden}
.ade-topbar{border-radius:12px;border:1px solid var(--app-border);background:var(--app-surface);display:flex;align-items:center;gap:8px;padding:0 10px;height:40px;flex-shrink:0}
.ade-topbar-btn{display:flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:6px;border:none;background:transparent;color:var(--app-text-2);cursor:pointer;font-size:14px}
.ade-topbar-btn:hover{background:rgba(255,255,255,0.05)}
.ade-project-name{font-weight:600;font-size:13px;color:var(--app-text);margin-left:2px}
.ade-branch-btn{display:flex;align-items:center;gap:5px;padding:2px 8px;border-radius:6px;border:1px solid var(--app-border);background:transparent;color:var(--app-text);font-size:12px;cursor:pointer}
.ade-branch-btn svg{width:12px;height:12px;opacity:.6}
.ade-sync-btn{display:flex;align-items:center;gap:3px;padding:2px 7px;border-radius:6px;border:1px solid var(--app-border);background:transparent;color:var(--app-text-2);font-size:12px;cursor:pointer}
.ade-topbar-spacer{flex:1}
.ade-sidebar-tabs{display:flex;padding:8px 8px 6px;flex-shrink:0}
.ade-sidebar-tabs-inner{display:flex;flex:1;background:var(--app-bg);border-radius:8px;padding:3px;gap:2px}
.ade-sidebar-tab{flex:1;padding:5px 0;text-align:center;font-size:12.5px;font-weight:500;border-radius:6px;border:none;background:transparent;color:var(--app-text-2);cursor:pointer;transition:all .15s;font-family:inherit}
.ade-sidebar-tab:hover{color:var(--app-text)}
.ade-sidebar-tab.active{background:var(--app-surface);border:1px solid var(--app-border);color:var(--app-text)}
.ade-sidebar-content{flex:1;overflow-y:auto;padding:0}
.ade-section-header{display:flex;align-items:center;justify-content:space-between;padding:10px 12px 6px;font-size:11px;font-weight:500;color:var(--app-text-2)}
.ade-section-actions{display:flex;gap:2px}
.ade-section-btn{display:flex;align-items:center;gap:3px;padding:3px 8px;border-radius:4px;border:none;background:rgba(255,255,255,0.04);color:var(--app-text-2);font-size:10px;cursor:pointer;font-family:inherit}
.ade-section-btn:hover{background:rgba(255,255,255,0.08)}
.ade-search{margin:0 8px 6px;padding:5px 8px;border-radius:6px;border:1px solid var(--app-border);background:var(--app-bg);color:var(--app-text);font-size:12px;font-family:inherit;outline:none;height:28px}
.ade-project-item{display:flex;align-items:center;gap:8px;padding:0 12px;height:36px;cursor:pointer;transition:background .1s;border-left:2px solid transparent}
.ade-project-item:hover{background:rgba(255,255,255,0.03)}
.ade-project-item.selected{background:rgba(110,106,222,0.08);border-left-color:var(--app-accent)}
.ade-project-icon{width:20px;height:20px;border-radius:4px;background:linear-gradient(135deg,var(--app-accent),#5530b8);display:flex;align-items:center;justify-content:center;font-size:9px;color:#fff;font-weight:700;flex-shrink:0}
.ade-project-info{flex:1;min-width:0}
.ade-project-title{font-size:13px;font-weight:500;color:var(--app-text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ade-project-path{font-size:11px;color:var(--app-text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:'Geist Mono',ui-monospace,monospace}
.ade-worktree-btn{display:flex;align-items:center;gap:4px;padding:4px 12px 4px 28px;font-size:11px;color:var(--app-text-2);cursor:pointer;border:1px dashed transparent;border-radius:4px;margin:1px 8px}
.ade-worktree-btn:hover{color:var(--app-text);border-color:var(--app-border)}
.ade-file-item{display:flex;align-items:center;gap:6px;padding:4px 12px 4px 16px;font-size:11px;color:var(--app-text);cursor:pointer}
.ade-file-item:hover{background:rgba(255,255,255,0.03)}
.ade-file-item .arrow{color:var(--app-text-2);font-size:8px;width:12px;text-align:center}
.ade-file-item .icon{font-size:12px;opacity:.7}
.ade-file-item .name{flex:1}
.ade-file-item.folder .name{color:var(--app-text)}
.ade-git-header{padding:10px 12px;display:flex;align-items:center;gap:8px}
.ade-git-branch{font-size:12px;color:var(--app-text);font-family:'Geist Mono',ui-monospace,monospace;display:flex;align-items:center;gap:4px}
.ade-git-change{display:flex;align-items:center;gap:6px;padding:4px 12px;font-size:11px;cursor:pointer}
.ade-git-change:hover{background:rgba(255,255,255,0.03)}
.ade-git-change .status{font-size:10px;font-weight:600;width:14px;text-align:center;font-family:'Geist Mono',ui-monospace,monospace}
.ade-git-change .status.m{color:var(--git-mod)}.ade-git-change .status.a{color:var(--git-add)}.ade-git-change .status.d{color:var(--git-del)}.ade-git-change .status.u{color:var(--git-unt)}
.ade-git-change .file{color:var(--app-text);font-family:'Geist Mono',ui-monospace,monospace;font-size:10.5px}
.ade-git-actions{display:flex;gap:4px;padding:8px 12px}
.ade-git-btn{padding:5px 12px;border-radius:5px;border:none;font-size:10.5px;font-weight:600;cursor:pointer;font-family:inherit}
.ade-git-btn.primary{background:var(--app-accent);color:#fff}
.ade-git-btn.secondary{background:transparent;color:var(--app-text);border:1px solid var(--app-border)}
.ade-main{border-radius:12px;border:1px solid var(--app-border);background:var(--app-surface);display:flex;flex-direction:column;overflow:hidden}
.ade-main-tabs{display:flex;align-items:center;gap:0;padding:0 8px;height:34px;border-bottom:1px solid var(--app-border);flex-shrink:0}
.ade-main-tab-btn{display:flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:5px;border:none;background:transparent;color:var(--app-text-2);cursor:pointer;font-size:13px}
.ade-main-tab-btn:hover{background:rgba(255,255,255,0.05)}
.ade-main-content{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.ade-start-label{font-size:13px;color:var(--app-text-2);font-weight:500}
.ade-start-options{display:flex;gap:10px}
.ade-start-btn{display:flex;align-items:center;gap:8px;padding:10px 18px;border-radius:8px;border:1px solid var(--app-border);background:transparent;color:var(--app-text);cursor:pointer;transition:all .15s;font-size:12px;font-weight:500;font-family:inherit}
.ade-start-btn:hover{background:rgba(110,106,222,0.1);border-color:rgba(110,106,222,0.3)}
.ade-start-btn .btn-icon{width:20px;height:20px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:11px}
.ade-start-btn .btn-icon.claude{background:linear-gradient(135deg,#d4a574,#c4956a)}
.ade-start-btn .btn-icon.auggie{background:linear-gradient(135deg,var(--app-info),#22d3ee)}
.ade-start-btn .btn-icon.terminal{background:rgba(255,255,255,0.1)}
.ade-start-hint{font-size:11px;color:var(--app-text-2);opacity:.6}
.ade-chat{flex:1;display:flex;flex-direction:column;padding:12px 16px;overflow-y:auto;gap:10px}
.ade-chat-msg{max-width:100%}.ade-chat-msg.user{align-self:flex-end}.ade-chat-msg.agent{align-self:flex-start;width:100%}
.ade-chat-sender{font-size:10px;color:var(--app-text-2);margin-bottom:3px;font-weight:600}
.ade-chat-bubble{font-size:13px;line-height:1.5}
.ade-chat-msg.user .ade-chat-bubble{background:var(--app-raised);border:1px solid var(--app-border);border-radius:8px;padding:8px 12px;margin-left:32px;color:var(--app-text)}
.ade-chat-msg.agent .ade-chat-bubble{background:transparent;border:none;padding:0;color:var(--app-text)}
.ade-chat-tools-group{margin-top:6px;border:1px solid var(--app-border);border-radius:6px;overflow:hidden}
.ade-chat-tools-summary{display:flex;align-items:center;gap:6px;padding:5px 10px;font-size:11px;color:var(--app-text-2);cursor:pointer;background:var(--app-surface)}
.ade-chat-tool-row{display:flex;align-items:center;gap:6px;padding:4px 10px;border-top:1px solid var(--app-border);font-size:11px;font-family:'Geist Mono',ui-monospace,monospace;color:var(--app-text-2)}
.ade-chat-tool-row .tool-status-ok{color:var(--app-pos)}
.ade-thought-block{font-size:12px;color:var(--app-text-2);font-style:italic;padding:4px 0 6px;display:flex;align-items:center;gap:6px}
.ade-thought-block.active{animation:thought-pulse 1.5s ease-in-out infinite}
@keyframes thought-pulse{0%,100%{opacity:.6}50%{opacity:1}}
.ade-chat-input{padding:8px 16px 12px;border-top:1px solid var(--app-border);display:flex;flex-direction:column;gap:6px;flex-shrink:0}
.ade-chat-input-toolbar{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--app-text-2)}
.ade-chat-input-row{display:flex;align-items:flex-end;gap:8px}
.ade-chat-input-field{flex:1;min-height:32px;padding:6px 10px;border:1px solid var(--app-border);border-radius:6px;background:var(--app-bg);color:var(--app-text);font-size:13px;font-family:inherit;resize:none;outline:none}
.ade-chat-send{width:36px;height:36px;border-radius:6px;border:1px solid var(--app-border);background:var(--app-surface);color:var(--app-text);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ade-chat-status{display:flex;align-items:center;gap:8px;padding:4px 16px;border-top:1px solid var(--app-border);font-size:10px;color:var(--app-text-2);flex-shrink:0}
.ade-ctx-bar{flex:1;height:3px;border-radius:2px;background:var(--app-raised);overflow:hidden}
.ade-ctx-bar-fill{height:100%;border-radius:2px;background:var(--app-accent);width:18%}
.ade-bottombar{display:flex;align-items:center;gap:6px;padding:0 8px;height:30px;border-top:1px solid var(--app-border);flex-shrink:0;font-size:10.5px;color:var(--app-text-2)}
.ade-bottom-btn{display:flex;align-items:center;gap:4px;padding:2px 8px;border-radius:4px;border:none;background:transparent;color:var(--app-text-2);cursor:pointer;font-size:10.5px;font-family:inherit}
.ade-bottom-btn:hover{background:rgba(255,255,255,0.04);color:var(--app-text)}
.ade-bottom-badge{display:inline-flex;align-items:center;justify-content:center;min-width:14px;height:14px;border-radius:7px;background:var(--app-accent);color:#fff;font-size:8px;font-weight:700;padding:0 3px}
.ade-bottom-spacer{flex:1}
.ade-bottom-meter{display:flex;align-items:center;gap:3px;font-family:'Geist Mono',ui-monospace,monospace;font-size:10px}
.ade-bottom-meter .bar{width:32px;height:4px;border-radius:2px;background:var(--app-raised);overflow:hidden}
.ade-bottom-meter .bar-fill{height:100%;border-radius:2px}
.ade-newclaw{padding:16px 20px;display:flex;flex-direction:column;gap:12px;flex:1;overflow-y:auto}
.ade-newclaw-title{font-size:14px;font-weight:600;color:var(--app-text);margin-bottom:2px}
.ade-newclaw-field{display:flex;flex-direction:column;gap:4px}
.ade-newclaw-label{font-size:12px;color:var(--app-text-2);font-weight:500}
.ade-newclaw-input,.ade-newclaw-select{padding:6px 10px;border-radius:6px;border:1px solid var(--app-border);background:var(--app-bg);color:var(--app-text);font-size:13px;font-family:inherit;outline:none}
.ade-newclaw-textarea{padding:6px 10px;border-radius:6px;border:1px solid var(--app-border);background:var(--app-bg);color:var(--app-text);font-size:13px;font-family:inherit;outline:none;min-height:64px;resize:none}
.ade-newclaw-footer{display:flex;justify-content:flex-end;gap:8px;padding-top:4px;margin-top:auto}
.ade-newclaw-cancel{padding:6px 14px;border-radius:6px;border:1px solid var(--app-border);background:transparent;color:var(--app-text-2);font-size:13px;cursor:pointer;font-family:inherit}
.ade-newclaw-create{padding:6px 14px;border-radius:6px;border:none;background:var(--app-accent);color:#fff;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit}
.ade-typing-dots{display:flex;align-items:center;gap:4px;padding:4px 0}
.ade-typing-dots span{width:5px;height:5px;border-radius:50%;background:var(--app-text-2);animation:dot-bounce .9s ease-in-out infinite;display:inline-block}
.ade-typing-dots span:nth-child(2){animation-delay:.16s}
.ade-typing-dots span:nth-child(3){animation-delay:.32s}
@keyframes dot-bounce{0%,80%,100%{transform:translateY(0);opacity:.4}40%{transform:translateY(-4px);opacity:1}}
.ade-chat-bubble .streaming-cursor{display:inline-block;width:5px;height:12px;background:var(--app-accent);margin-left:2px;vertical-align:middle;animation:blink 1s step-end infinite}
@keyframes blink{50%{opacity:0}}
.ade-chat-tool-row.streaming-in{animation:tool-fade-in .3s ease-out forwards}
@keyframes tool-fade-in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.ade-chat-msg.streaming-msg{animation:msg-slide-in .25s ease-out forwards}
@keyframes msg-slide-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>

const LocaleContext=createContext({locale:'vi',t:k=>k,setLocale:()=>{}});

function LocaleProvider({children}){
  const[locale,setLocaleState]=useState(()=>{
    const saved=localStorage.getItem('spec-ade-locale');
    if(saved)return saved;
    const lang=navigator.language||'';
    return lang.startsWith('en')?'en':'vi';
  });
  const[strings,setStrings]=useState(VI_STRINGS||{});
  const setLocale=useCallback((l)=>{
    setLocaleState(l);
    localStorage.setItem('spec-ade-locale',l);
    document.documentElement.lang=l;
  },[]);
  useEffect(()=>{
    document.documentElement.lang=locale;
    if(!localStorage.getItem('spec-ade-locale'))localStorage.setItem('spec-ade-locale',locale);
    if(locale==='vi'&&strings===VI_STRINGS)return;
    fetch(`locales/${locale}.json`).then(r=>r.json()).then(setStrings).catch(()=>{
      if(locale==='vi'&&VI_STRINGS)setStrings(VI_STRINGS);
    });
  },[locale]);
  const t=useCallback((key)=>strings[key]||key,[strings]);
  return <LocaleContext.Provider value={{locale,t,setLocale}}>{children}</LocaleContext.Provider>;
}
function useLocale(){return useContext(LocaleContext);}

/* === THEME TOGGLE === */
function ThemeToggle(){
  const[theme,setTheme]=useState(()=>document.documentElement.getAttribute('data-theme')==='light'?'light':'dark');
  const toggle=()=>{
    const next=theme==='dark'?'light':'dark';
    setTheme(next);
    localStorage.setItem('spec-ade-theme',next);
    if(next==='light')document.documentElement.setAttribute('data-theme','light');
    else document.documentElement.removeAttribute('data-theme');
  };
  return(
    <button className="theme-toggle" onClick={toggle} aria-label={theme==='dark'?'Switch to light mode':'Switch to dark mode'}>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true" style={{transform:theme==='dark'?'rotate(0deg)':'rotate(180deg)'}}>
        {theme==='dark'
          ?<><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></>
          :<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>}
      </svg>
    </button>
  );
}

/* === CURSOR GLOW === */
function CursorGlow(){
  const ref=useRef(null);
  useEffect(()=>{
    const h=e=>{if(ref.current){ref.current.style.left=e.clientX+'px';ref.current.style.top=e.clientY+'px';ref.current.style.opacity='1';}};
    window.addEventListener('mousemove',h);
    return()=>window.removeEventListener('mousemove',h);
  },[]);
  return <div ref={ref} className="cursor-glow" style={{opacity:0}}/>;
}

/* === REVEAL HOOK === */
function useReveal(){
  useEffect(()=>{
    const obs=new IntersectionObserver(entries=>{entries.forEach(e=>{if(e.isIntersecting)e.target.classList.add('in');});},{threshold:0.12});
    document.querySelectorAll('.reveal').forEach(el=>obs.observe(el));
    return()=>obs.disconnect();
  },[]);
}

/* === COUNTER === */
function Counter({to,suffix='',duration=1600}){
  const[val,setVal]=useState(0);const ref=useRef(null);
  useEffect(()=>{
    const obs=new IntersectionObserver(entries=>{
      if(entries[0].isIntersecting){const start=performance.now();const tick=now=>{const t=Math.min((now-start)/duration,1);setVal(Math.round((1-Math.pow(1-t,3))*to));if(t<1)requestAnimationFrame(tick);};requestAnimationFrame(tick);obs.disconnect();}
    });if(ref.current)obs.observe(ref.current);return()=>obs.disconnect();
  },[to,duration]);
  return <span ref={ref}>{val.toLocaleString()}{suffix}</span>;
}

/* === SCROLL PROGRESS === */
function ScrollProgress(){
  useEffect(()=>{
    const update=()=>{const max=document.documentElement.scrollHeight-window.innerHeight;const p=max>0?window.scrollY/max:0;document.documentElement.style.setProperty('--p',p);};
    update();window.addEventListener('scroll',update,{passive:true});window.addEventListener('resize',update);
    return()=>{window.removeEventListener('scroll',update);window.removeEventListener('resize',update);};
  },[]);
  return <div className="scroll-progress"/>;
}

/* === COPY COMMAND === */
function CopyCommand({command='npm i -g @spec-ade/cli'}){
  const[copied,setCopied]=useState(false);
  const handleCopy=()=>{
    navigator.clipboard.writeText(command).then(()=>{setCopied(true);setTimeout(()=>setCopied(false),2000);});
  };
  return(
    <div className="copy-cmd" onClick={handleCopy} title="Click to copy">
      <code>{command}</code>
      <button className="copy-btn" aria-label="Copy command">
        {copied
          ?<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="20 6 9 17 4 12"/></svg>
          :<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>}
      </button>
      {copied&&<span className="copy-toast">Copied!</span>}
    </div>
  );
}

/* === LIGHTBOX === */
function Lightbox({open,onClose}){
  const[scene,setScene]=useState('files');
  useEffect(()=>{
    if(!open)return;
    const h=e=>{if(e.key==='Escape')onClose();};
    window.addEventListener('keydown',h);
    return()=>window.removeEventListener('keydown',h);
  },[open,onClose]);
  if(!open)return null;
  return(
    <div className="lightbox-overlay" role="dialog" aria-modal="true" onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
      <button className="lightbox-close" onClick={onClose} aria-label="Close">×</button>
      <div>
        <div className="lightbox-content"><AppMockup scene={scene}/></div>
        <div className="lightbox-tabs">
          {[['files','File & Chat'],['git','Git'],['projects','Projects'],['claw','New Claw']].map(([id,label])=>(
            <button key={id} className={`lightbox-tab${scene===id?' on':''}`} onClick={()=>setScene(id)}>{label}</button>
          ))}
        </div>
      </div>
    </div>
  );
}

/* === APP === */
function App(){
  useReveal();
  const[lightboxOpen,setLightboxOpen]=useState(false);

  /* Task 3: Card cursor-tracking glow */
  useEffect(()=>{
    const handler=(e)=>{const el=e.currentTarget;const r=el.getBoundingClientRect();el.style.setProperty('--mx',(e.clientX-r.left)+'px');el.style.setProperty('--my',(e.clientY-r.top)+'px');};
    let cards;
    const init=()=>{cards=document.querySelectorAll('.feat-card,.usecase,.roadmap-card,.deep-card');cards.forEach(c=>c.addEventListener('mousemove',handler));};
    const t=setTimeout(init,100);
    return()=>{clearTimeout(t);if(cards)cards.forEach(c=>c.removeEventListener('mousemove',handler));};
  },[]);

  /* Task 8: Aurora parallax on scroll */
  useEffect(()=>{
    const auroras=document.querySelectorAll('.bg-aurora');
    const onScroll=()=>{const y=window.scrollY;auroras.forEach((a,i)=>{a.style.translate=`0 ${y*(0.05+i*0.03)}px`;});};
    window.addEventListener('scroll',onScroll,{passive:true});
    return()=>window.removeEventListener('scroll',onScroll);
  },[]);

  /* Task 9: Hero screenshot 3D tilt */
  useEffect(()=>{
    const el=document.querySelector('.hero-screenshot');
    if(!el)return;
    const handler=(e)=>{const r=el.getBoundingClientRect();const cx=r.left+r.width/2;const cy=r.top+r.height/2;const rx=((e.clientY-cy)/r.height)*-3;const ry=((e.clientX-cx)/r.width)*3;el.style.transform=`perspective(1000px) rotateX(${rx}deg) rotateY(${ry}deg)`;};
    const reset=()=>{el.style.transform='';};
    el.addEventListener('mousemove',handler);el.addEventListener('mouseleave',reset);
    return()=>{el.removeEventListener('mousemove',handler);el.removeEventListener('mouseleave',reset);};
  },[]);

  return(
    <>
      <ScrollProgress/>
      <CursorGlow/>
      <div className="bg-fx">
        <div className="bg-grid"></div>
        <div className="bg-aurora a1"></div>
        <div className="bg-aurora a2"></div>
        <div className="bg-aurora a3"></div>
      </div>
      <Nav/>
      <Hero onOpenLightbox={()=>setLightboxOpen(true)}/>
      <Comparison/>
      <FeatureDeepDive/>
      <Features/>
      <UseCases/>
      <Roadmap/>
      <CTA/>
      <Footer/>
      <Lightbox open={lightboxOpen} onClose={()=>setLightboxOpen(false)}/>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<LocaleProvider><App/></LocaleProvider>);
